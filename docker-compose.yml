# usage: cp .env.example .env && docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_ENDPOINT: redis
      REDIS_PORT: "6379"
      TZ: ${TZ:-Asia/Taipei}
    ports:
      # status page, local only
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/health"]
      interval: 1m
      timeout: 10s
      start_period: 1m

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  redis-data:
