# 啟動：docker compose up -d（或執行 start.bat / start.sh）
# 設定頁：http://localhost:9090
name: ptt-alertor

services:
  app:
    # prebuilt image of the latest 1.x release, built from source when it can not be pulled
    image: ghcr.io/ja1221/ptt-alertor:1
    build: .
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_ENDPOINT: redis
      REDIS_PORT: "6379"
      TZ: ${TZ:-Asia/Taipei}
    ports:
      # setup and status page, this computer only
      - "127.0.0.1:${PORT:-9090}:9090"
    mem_limit: 128m
    logging:
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    # append only file keeps data across restarts, snapshots are not needed
    command: redis-server --appendonly yes --save "" --maxmemory 64mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    mem_limit: 96m
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  redis-data:
