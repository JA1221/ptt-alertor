{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb;
    --ok: #15803d; --ok-bg: #dcfce7; --bad: #b91c1c; --bad-bg: #fee2e2;
    --accent: #2563eb; --accent-text: #fff; --code: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1f26; --text: #e5e7eb; --muted: #9ca3af; --line: #2b323c;
      --ok: #4ade80; --ok-bg: #12301f; --bad: #f87171; --bad-bg: #3a1717;
      --accent: #3b82f6; --accent-text: #fff; --code: #242b35;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  main.narrow { max-width: 560px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  a { color: var(--accent); }
  code { background: var(--code); padding: 1px 6px; border-radius: 4px; font-size: 14px; overflow-wrap: anywhere; }
  .muted { color: var(--muted); font-size: 13px; }
  .banner { padding: 14px 16px; border-radius: 10px; margin: 16px 0; font-weight: 600; }
  .banner ul { margin: 6px 0 0; padding-left: 20px; font-weight: 400; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .banner.ok { background: var(--ok-bg); } .banner.bad { background: var(--bad-bg); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .grid .card { margin: 0; }
  .label { color: var(--muted); font-size: 13px; }
  .value { font-size: 17px; font-weight: 600; margin: 2px 0; overflow-wrap: anywhere; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; border-top: 0; white-space: nowrap; }
  td.nowrap { white-space: nowrap; }
  .pre { white-space: pre-line; }
  .button { display: inline-block; background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px;
    padding: 10px 18px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
  input[type=text] { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); margin: 8px 0 12px; }
  ol { padding-left: 22px; margin: 8px 0; } li { margin: 4px 0; }
  .steps { display: flex; gap: 8px; margin: 16px 0; font-size: 13px; }
  .steps span { flex: 1; text-align: center; padding: 6px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
  .steps span.on { border-color: var(--accent); color: var(--text); font-weight: 600; }
  .steps span.done { color: var(--ok); }
</style>
{{end}}
