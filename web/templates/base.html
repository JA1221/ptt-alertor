{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb;
    --ok: #15803d; --ok-bg: #dcfce7; --bad: #b91c1c; --bad-bg: #fee2e2;
    --accent: #2563eb; --accent-text: #fff; --code: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1f26; --text: #e5e7eb; --muted: #9ca3af; --line: #2b323c;
      --ok: #4ade80; --ok-bg: #12301f; --bad: #f87171; --bad-bg: #3a1717;
      --accent: #3b82f6; --accent-text: #fff; --code: #242b35;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  main.narrow { max-width: 560px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  a { color: var(--accent); }
  code { background: var(--code); padding: 1px 6px; border-radius: 4px; font-size: 14px; overflow-wrap: anywhere; }
  .muted { color: var(--muted); font-size: 13px; }
  .banner { padding: 14px 16px; border-radius: 10px; margin: 16px 0; font-weight: 600; }
  .banner ul { margin: 6px 0 0; padding-left: 20px; font-weight: 400; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .banner.ok { background: var(--ok-bg); } .banner.bad { background: var(--bad-bg); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .grid .card { margin: 0; }
  .label { color: var(--muted); font-size: 13px; }
  .value { font-size: 17px; font-weight: 600; margin: 2px 0; overflow-wrap: anywhere; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; border-top: 0; white-space: nowrap; }
  td.nowrap { white-space: nowrap; }
  td a { color: inherit; text-decoration: none; }
  td a:hover { color: var(--accent); text-decoration: underline; }
  .pre { white-space: pre-line; }
  .button { display: inline-block; background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px;
    padding: 10px 18px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
  input[type=text] { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); margin: 8px 0 12px; }
  ol { padding-left: 22px; margin: 8px 0; } li { margin: 4px 0; }
  .steps { display: flex; gap: 8px; margin: 16px 0; font-size: 13px; }
  .steps span { flex: 1; text-align: center; padding: 6px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
  .steps span.on { border-color: var(--accent); color: var(--text); font-weight: 600; }
  .steps span.done { color: var(--ok); }
  .button.small { padding: 6px 12px; font-size: 14px; }
  .button.secondary { background: var(--code); color: var(--text); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .row form { margin: 0; }
  .grow { flex: 1; min-width: 160px; }
  .card.attention { border-color: var(--accent); }
  .card.attention .row + .row { margin-top: 8px; }
  .flash { font-weight: 500; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--card); color: var(--text); padding: 6px 14px; font: inherit; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .member { padding: 12px 0; border-top: 1px solid var(--line); }
  .member:first-of-type { border-top: 0; padding-top: 0; }
  .subs-head { display: flex; gap: 6px; margin-top: 10px; font-size: 12px; }
  .subs-head span:first-child, .subs .board { flex: 0 0 120px; overflow-wrap: anywhere; }
  .subs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0; padding-top: 6px; border-top: 1px dashed var(--line); }
  .subs .board { font-weight: 600; }
  .chip { display: inline-flex; align-items: center; background: var(--code); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 14px; margin: 0; }
  .chip button { border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; padding: 2px 6px; cursor: pointer; border-radius: 999px; }
  .chip button:hover { color: var(--bad); background: var(--bad-bg); }
  form.add { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  form.add input[type=text] { flex: 1; min-width: 140px; width: auto; margin: 0; padding: 6px 10px; }
  input[type=file] { font: inherit; font-size: 14px; max-width: 100%; }
  button:disabled { opacity: .6; cursor: progress; }
  tr.older, main.show-older .when-folded, .when-shown { display: none; }
  main.show-older tr.older { display: table-row; }
  main.show-older .when-shown { display: inline; }
  button.more { border: 0; background: none; color: var(--accent); font: inherit; font-size: 14px; padding: 8px 0 0; cursor: pointer; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); max-width: calc(100% - 32px);
    padding: 10px 18px; border-radius: 10px; font-weight: 500; box-shadow: 0 6px 24px rgba(0,0,0,.18);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.ok { background: var(--ok-bg); color: var(--ok); }
  .toast.bad { background: var(--bad-bg); color: var(--bad); }
</style>
{{end}}

{{define "live"}}
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
// updates the page in place: no reload flash, scroll position stays
(function () {
  var main = document.querySelector('main');
  var page = main.dataset.page;
  var toastEl = document.getElementById('toast');
  var timer;

  function toast(text, bad) {
    toastEl.textContent = text;
    toastEl.className = 'toast show ' + (bad ? 'bad' : 'ok');
    clearTimeout(timer);
    timer = setTimeout(function () { toastEl.className = 'toast'; }, bad ? 6000 : 3000);
  }

  // flash messages of the server become toasts
  function flashes(root) {
    Array.prototype.forEach.call(root.querySelectorAll('.flash'), function (el) {
      toast(el.textContent.trim(), el.classList.contains('bad'));
      el.remove();
    });
  }

  function swap(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var next = doc.querySelector('main');
    if (!next || next.dataset.page !== page) {
      location.replace('/');
      return;
    }
    flashes(next);
    main.innerHTML = next.innerHTML;
    main.dataset.refresh = next.dataset.refresh;
    document.title = doc.title;
  }

  // typing or choosing a file must not be lost
  function busy() {
    return Array.prototype.some.call(main.querySelectorAll('input[type=text], input[type=file]'), function (el) {
      return el.value !== '' || el === document.activeElement;
    });
  }

  var last = Date.now();
  setInterval(function () {
    var every = Number(main.dataset.refresh) * 1000;
    if (!every || document.hidden || busy() || Date.now() - last < every) return;
    last = Date.now();
    fetch('/', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(swap).catch(function () {});
  }, 1000);

  // inputs shadow same named properties of their form (an input named action hides form.action),
  // so forms are read by attributes only
  function attr(form, name) {
    return Element.prototype.getAttribute.call(form, name);
  }

  document.addEventListener('submit', function (e) {
    var form = e.target;
    if ((attr(form, 'method') || '').toLowerCase() !== 'post' || attr(form, 'data-native') !== null) return;
    e.preventDefault();
    var ask = attr(form, 'data-confirm');
    if (ask && !confirm(ask)) return;
    var data = new FormData(form);
    if (e.submitter && e.submitter.name) data.append(e.submitter.name, e.submitter.value);
    var buttons = Element.prototype.querySelectorAll.call(form, 'button');
    Array.prototype.forEach.call(buttons, function (b) { b.disabled = true; });
    fetch(attr(form, 'action'), { method: 'POST', body: data })
      .then(function (r) {
        if (r.ok) return r.text();
        // server explains rejected requests in plain text
        return r.text().then(function (text) {
          throw new Error((text.trim() || r.statusText) + '（' + r.status + '）');
        });
      })
      .then(function (html) { last = Date.now(); swap(html); })
      .catch(function (err) {
        Array.prototype.forEach.call(buttons, function (b) { b.disabled = false; });
        toast('操作失敗：' + err.message, true);
      });
  });

  flashes(main);
  if (location.search) history.replaceState(null, '', '/' + location.hash);
})();
</script>
{{end}}
